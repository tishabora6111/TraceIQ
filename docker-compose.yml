name: traceiq

# Shared by every service that runs the backend image (api, worker, migrate), so they always
# see the same database and settings.
x-backend-environment: &backend-environment
  TRACEIQ_ENV: ${TRACEIQ_ENV:-development}
  TRACEIQ_LOG_LEVEL: ${TRACEIQ_LOG_LEVEL:-INFO}
  TRACEIQ_CORS_ORIGINS: ${TRACEIQ_CORS_ORIGINS:-http://localhost:5173}
  # Passed as separate parts; the backend builds the URL with SQLAlchemy URL.create,
  # so credentials are never interpolated into a URL string.
  TRACEIQ_DATABASE_HOST: db
  TRACEIQ_DATABASE_PORT: "5432"
  TRACEIQ_DATABASE_USER: ${POSTGRES_USER:-traceiq}
  TRACEIQ_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  TRACEIQ_DATABASE_NAME: ${POSTGRES_DB:-traceiq}
  # Background jobs and worker.
  TRACEIQ_JOB_DEFAULT_LEASE_SECONDS: ${TRACEIQ_JOB_DEFAULT_LEASE_SECONDS:-300}
  TRACEIQ_JOB_DEFAULT_MAX_ATTEMPTS: ${TRACEIQ_JOB_DEFAULT_MAX_ATTEMPTS:-5}
  TRACEIQ_JOB_BACKOFF_BASE_SECONDS: ${TRACEIQ_JOB_BACKOFF_BASE_SECONDS:-10}
  TRACEIQ_JOB_BACKOFF_MAX_SECONDS: ${TRACEIQ_JOB_BACKOFF_MAX_SECONDS:-3600}
  TRACEIQ_WORKER_POLL_INTERVAL_SECONDS: ${TRACEIQ_WORKER_POLL_INTERVAL_SECONDS:-1}
  TRACEIQ_WORKER_MAINTENANCE_INTERVAL_SECONDS: ${TRACEIQ_WORKER_MAINTENANCE_INTERVAL_SECONDS:-15}
  # File storage: fixed to the storage-data mount point (api and worker), so it is not configurable here.
  # migrate gets it too because loading settings in production requires an absolute storage root.
  TRACEIQ_STORAGE_ROOT: /data/storage

# One image, built once and shared by api, worker and migrate.
x-backend-image: &backend-image
  image: traceiq-backend:local
  build:
    context: ./backend
    target: runtime

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-traceiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-traceiq}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies database migrations, then exits. api and worker start only after it succeeds.
  migrate:
    <<: *backend-image
    command: ["alembic", "upgrade", "head"]
    environment: *backend-environment
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend-image
    environment:
      <<: *backend-environment
      # Authentication: API only (the worker and migrate never receive the signing secrets).
      # Empty secrets make the API refuse to start with an explanatory error; other services still start.
      TRACEIQ_JWT_SECRET: ${TRACEIQ_JWT_SECRET:-}
      TRACEIQ_CSRF_SECRET: ${TRACEIQ_CSRF_SECRET:-}
      TRACEIQ_AUTH_COOKIE_SECURE: ${TRACEIQ_AUTH_COOKIE_SECURE:-true}
      TRACEIQ_AUTH_COOKIE_SAMESITE: ${TRACEIQ_AUTH_COOKIE_SAMESITE:-lax}
      TRACEIQ_AUTH_COOKIE_DOMAIN: ${TRACEIQ_AUTH_COOKIE_DOMAIN:-}
      # Empty: enabled in development, disabled in production.
      TRACEIQ_AUTH_REGISTRATION_ENABLED: ${TRACEIQ_AUTH_REGISTRATION_ENABLED:-}
      TRACEIQ_AUTH_MAX_CONCURRENT_HASHES: ${TRACEIQ_AUTH_MAX_CONCURRENT_HASHES:-4}
      TRACEIQ_AUTH_HASH_WAIT_TIMEOUT_SECONDS: ${TRACEIQ_AUTH_HASH_WAIT_TIMEOUT_SECONDS:-10}
      TRACEIQ_ACCESS_TOKEN_TTL_SECONDS: ${TRACEIQ_ACCESS_TOKEN_TTL_SECONDS:-900}
      TRACEIQ_REFRESH_TOKEN_TTL_SECONDS: ${TRACEIQ_REFRESH_TOKEN_TTL_SECONDS:-604800}
      TRACEIQ_REFRESH_TOKEN_ABSOLUTE_TTL_SECONDS: ${TRACEIQ_REFRESH_TOKEN_ABSOLUTE_TTL_SECONDS:-2592000}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - storage-data:/data/storage
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Background job worker (one job at a time per container; scale with --scale worker=N).
  worker:
    <<: *backend-image
    command: ["python", "-m", "app.worker"]
    environment: *backend-environment
    # SIGTERM stops new claims and lets the current job finish. Jobs still running when the
    # grace period ends are killed; their lease expires and recovery requeues them.
    stop_grace_period: 60s
    restart: unless-stopped
    volumes:
      - storage-data:/data/storage
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - api

volumes:
  postgres-data:
  # Stored files (reference datasets, model artifacts), shared by api and worker.
  storage-data:
