name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only token: CI only checks out and tests code; it never writes to the repository.
permissions:
  contents: read

# A newer run for the same pull request or branch cancels the older one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # CI-only dummy credentials for a throwaway database; not a secret.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          # The fixtures connect to TRACEIQ_DATABASE_NAME to create traceiq_test, so it must exist.
          POSTGRES_DB: traceiq
        ports:
          - 5432:5432
        # TCP check: the image's first-start initialisation server listens only on a Unix socket.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d traceiq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TRACEIQ_ENV: test
      # Database tests fail instead of skipping when PostgreSQL is unavailable.
      TRACEIQ_TEST_REQUIRE_DB: "1"
      # The test fixtures create and migrate the traceiq_test database themselves, so this user
      # needs CREATEDB (the image's superuser has it). JWT and CSRF test secrets are set in conftest.
      TRACEIQ_DATABASE_HOST: 127.0.0.1
      TRACEIQ_DATABASE_PORT: "5432"
      TRACEIQ_DATABASE_USER: postgres
      TRACEIQ_DATABASE_PASSWORD: ci-only-password
      TRACEIQ_DATABASE_NAME: traceiq
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend with dev dependencies
        run: pip install "./backend[dev]"
      - name: Run tests
        working-directory: backend
        run: pytest

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      # Includes the TypeScript check (tsc -b && vite build).
      - run: npm run build

  docker:
    name: Docker Compose and images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Compose requires POSTGRES_PASSWORD; nothing is started, so a dummy value is enough.
      POSTGRES_PASSWORD: ci-dummy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose config --quiet
      # Builds only; no container is started. api, worker and migrate share the backend image.
      - name: Build backend and frontend images
        run: docker compose build api frontend
